---
layout: default
---
<section class="hero">
  <div class="wrap">
    <p class="eyebrow">Visual Ecology Lab</p>
    <h1>{{ page.title | default: site.title }}</h1>
    <p>{{ page.subtitle | default: site.tagline }}</p>
  </div>
</section>

<section class="section wrap">
  {% assign recent_posts = site.posts | first: site.recent_posts_count %}
  {% include carousel.html posts=recent_posts heading="Recent posts" %}
</section>

<section class="section wrap page-content" style="padding-top:0;">
  <div class="blurb">
    {{ content }}
  </div>
</section>
