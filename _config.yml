# Site settings
title: "Jolyon Troscianko"
tagline: "Visual ecology, visual modelling & light pollution research"
description: >-
  Research lab group site covering visual ecology, visual modelling and light pollution,
  plus the software tools (micaToolbox, BehaveAI and more) built to support that work.
url: "https://www.jolyon.co.uk"
baseurl: ""
email: "j dot troscianko at exeter dot ac dot uk"
author: "Jolyon Troscianko"

# Homepage recent-posts grid
recent_posts_count: 24

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /posts/:slug/

collections:
  pages:
    output: true
    permalink: /:path/

# Order matters: later entries win when a file matches more than one scope,
# so the generic (untyped) default comes first and the type-scoped ones after it.
defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "theme-page"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - "*.gemspec"

# Navigation data lives in _data/navigation.yml
